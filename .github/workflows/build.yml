name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          echo "=== ОШИБКИ KOTLIN ==="
          grep -E "^e: " build.log | head -60 || true
          echo "=== WHAT WENT WRONG ==="
          grep -A8 "What went wrong" build.log | head -40 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XFM-apk
          path: app/build/outputs/apk/release/*.apk
